plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

android {
namespace 'br.com.industrialdiagnostic'
compileSdk 35

defaultConfig {
    applicationId 'br.com.industrialdiagnostic'
    minSdk 24
    targetSdk 35
    versionCode 3
    versionName '0.3.0'
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}

}
